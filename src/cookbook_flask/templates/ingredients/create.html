{% extends "base.html" %} {% block title %}New Ingredient{% endblock %} {% block
content %}
<h1>New Ingredient</h1>
<form method="post">
    {{ form.hidden_tag() }}
    <label>{{ form.name.label }} {{ form.name(size=32) }}</label>
    {% if form.name.errors %}
        <div>{{ form.name.errors[0] }}</div>
    {% endif %}
    <div>{{ form.submit() }}</div>
</form>
<p><a href="{{ url_for('ingredients.list_ingredients') }}">Back</a></p>
{% endblock %}
