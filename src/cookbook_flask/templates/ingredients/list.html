{% extends "base.html" %} {% block title %}Ingredients{% endblock %}
{% block content %}
    <h1>Ingredients</h1>
    <p>
        <a href="{{ url_for('ingredients.create_ingredient') }}">+ New Ingredient</a>
    </p>
    <ul>
        {% for it in items %}
            <li>
                {{ it.name }}
                <a href="{{ url_for('ingredients.edit_ingredient', id=it.id) }}">Edit</a>
                <form
                action="{{ url_for('ingredients.delete_ingredient', id=it.id) }}"
                method="post"
                style="display: inline"
                >
                <button type="submit">Delete</button>
                </form>
            </li>
        {% else %}
            <li>No ingredients yet.</li>
        {% endfor %}
    </ul>
{% endblock content %}
